      - paragraph [ref=f9e66]: We pride ourselves on our quality products, including road transfers, boating and accommodation. Our business strategy revolves around providing quality service to our target customers, through a professional team and good quality, customer-designed travel packages.
      - paragraph [ref=f9e67]: We seek to differentiate ourselves as the premier adventure travel company in the greater Victoria Falls area — a position earned through clear arrangements and personal contact rather than volume.
