        - paragraph [ref=f20e22]: Our home base. Tours, guided Falls experiences, road and water transfers and accommodation arranged from a Victoria Falls office.
    - generic [ref=f20e24]:
      - paragraph [ref=f20e25]: Zeresh Trading Company (Pvt) Ltd, trading as Beneath Africa Travel and Tours, was established in 2013 and is based in Victoria Falls, with a vision to grow within Zimbabwe. The company specialises in road and water transfers, accommodation in hotels, lodges and camps, camping, houseboats on Lake Kariba, Chobe day trips and activities in and around Victoria Falls.
      - paragraph [ref=f20e26]: Because we operate from here, a Victoria Falls itinerary starts and ends with a company that can be reached the same day — whether the plan is on track or has just changed.
