                  - heading "Namibia" [level=3] [ref=f4e600]
                  - paragraph [ref=f4e602]: "Towering dunes at Sossusvlei, the Skeleton Coast's fog and shipwrecks, and desert-adapted elephants that survive where water barely exists. Namibia stuns through landscape rather than density: vast, stark and surreal, for travelers drawn to solitude and geology."
