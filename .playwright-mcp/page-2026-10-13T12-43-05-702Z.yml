        - generic [ref=f4e435]:
          - heading "Where We Go" [level=2] [ref=f4e437]
          - paragraph [ref=f4e439]: East and Southern Africa, seen mostly from the private reserves and conservancies that border the great parks, where fewer vehicles share each sighting and your stay helps keep the land wild.
          - paragraph [ref=f4e445] [cursor=pointer]:
