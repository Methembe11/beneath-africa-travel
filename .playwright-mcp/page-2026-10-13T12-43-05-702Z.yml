                - link [ref=f4e463] [cursor=pointer]:
                  - /url: ./safari-destinations/kenya
                  - img "A Maasai host beside a sundowner table beneath a lone tree on the Mara plains" [ref=f4e467]
                - link [ref=f4e468] [cursor=pointer]:
                  - /url: ./safari-destinations/kenya
                  - heading "Kenya" [level=3] [ref=f4e470]
                  - paragraph [ref=f4e472]: "The Maasai Mara stretches golden under enormous skies: lions in tall grass, herds moving toward ancient rhythms. Kenya delivers safari at its most iconic, the Africa you imagined before you knew the details."
                - paragraph [ref=f4e477] [cursor=pointer]:
                  - link "Explore Kenya" [ref=f4e478]:
                    - /url: ./safari-destinations/kenya
              - generic [ref=f4e484]:
                - link [ref=f4e489] [cursor=pointer]:
                  - /url: ./safari-destinations/botswana
                  - img "A poler steering a mokoro canoe across the still waters of the Okavango Delta" [ref=f4e493]
                - link [ref=f4e494] [cursor=pointer]:
                  - /url: ./safari-destinations/botswana
                  - heading "Botswana" [level=3] [ref=f4e496]
                  - paragraph [ref=f4e498]: "The Okavango Delta floods through the dry season, so you glide by mokoro past elephants crossing the channels. Private concessions mean low density and high exclusivity: few vehicles at a sighting, off-road driving, walking and night drives, and superb wild dog country."
                - paragraph [ref=f4e503] [cursor=pointer]:
                  - link "Explore Botswana" [ref=f4e504]:
                    - /url: ./safari-destinations/botswana
              - generic [ref=f4e510]:
                - link [ref=f4e515] [cursor=pointer]:
                  - /url: ./safari-destinations/rwanda-and-uganda
                  - img "An infant mountain gorilla resting against its mother in the rainforest" [ref=f4e519]
                - link [ref=f4e520] [cursor=pointer]:
                  - /url: ./safari-destinations/rwanda-and-uganda
                  - heading "Rwanda & Uganda" [level=3] [ref=f4e522]
                  - paragraph [ref=f4e524]: Mountain gorillas in mist-wrapped forest. The encounter lasts one hour and stays with you permanently. Trekkers must be fifteen or older and permits are limited, so both countries reward early planning, and both pair easily with savanna in Kenya or Tanzania.
                - paragraph [ref=f4e529] [cursor=pointer]:
                  - link "Explore Rwanda & Uganda" [ref=f4e530]:
                    - /url: ./safari-destinations/rwanda-and-uganda
              - generic [ref=f4e536]:
                - link [ref=f4e541] [cursor=pointer]:
                  - /url: ./safari-destinations/tanzania
                  - img "A safari vehicle amid wildebeest herds on the move across green plains" [ref=f4e545]
                - link [ref=f4e546] [cursor=pointer]:
                  - /url: ./safari-destinations/tanzania
                  - heading "Tanzania" [level=3] [ref=f4e548]
                  - paragraph [ref=f4e550]: The Serengeti for the Migration and big cats, the Ngorongoro Crater for sheer density, and the Swahili coast to finish barefoot. Tanzania gives you scale and intimacy on one journey, with Ruaha and Nyerere in the south for travelers who want fewer vehicles still.
                - paragraph [ref=f4e555] [cursor=pointer]:
                  - link "Explore Tanzania" [ref=f4e556]:
                    - /url: ./safari-destinations/tanzania
              - generic [ref=f4e562]:
                - link [ref=f4e567] [cursor=pointer]:
                  - /url: ./safari-destinations/south-africa
                  - img "Guests in an open safari vehicle watching an elephant emerge from the trees" [ref=f4e571]
                - link [ref=f4e572] [cursor=pointer]:
                  - /url: ./safari-destinations/south-africa
                  - heading "South Africa" [level=3] [ref=f4e574]
                  - paragraph [ref=f4e576]: Big Five reserves, wine country, coastal drives and Cape Town, all in one country. It makes the easiest first safari and the easiest family safari, with malaria-free reserves in the Eastern Cape, Madikwe and the Kalahari, and the Sabi Sand for leopards.
                - paragraph [ref=f4e581] [cursor=pointer]:
                  - link "Explore South Africa" [ref=f4e582]:
                    - /url: ./safari-destinations/south-africa
              - generic [ref=f4e588]:
                - link [ref=f4e593] [cursor=pointer]:
