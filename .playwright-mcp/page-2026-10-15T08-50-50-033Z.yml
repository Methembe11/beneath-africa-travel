      - generic [ref=f13e33]:
        - heading "Based In Victoria Falls" [level=3] [ref=f13e34]
        - paragraph [ref=f13e35]: 483 Jacaranda Crescent, P.O. Box 262, Victoria Falls.
      - generic [ref=f13e36]:
        - heading "2019 Award" [level=3] [ref=f13e37]
        - paragraph [ref=f13e38]: Best First-Time Exhibitor Stand Award, Sanganai / Hlanganani World Tourism Expo.
    - generic [ref=f13e41]:
      - heading "What We Set Out To Do" [level=2] [ref=f13e42]
      - paragraph [ref=f13e43]: Beneath Africa Travel and Tours provides individual and group travel to leisure clients, and seeks to differentiate itself as the premier adventure travel company in the greater Victoria Falls area.
      - paragraph [ref=f13e44]: Our business strategy revolves around the need to provide quality service to our various target customers. That is undertaken through the recruitment of a professional team and the provision of good quality, customer-designed travel packages.
    - generic [ref=f13e47]:
      - heading "Where That Has Taken Us" [level=2] [ref=f13e48]
      - paragraph [ref=f13e49]: We are happy to say that we are slowly but surely approaching and living that vision, and we were awarded the Best First-Time Exhibitor Stand Award at the 2019 Sanganai / Hlanganani World Tourism Expo.
      - paragraph [ref=f13e50]: Since 2013 we have provided road transfers for clients in Botswana, Zambia and Zimbabwe, driven travellers across borders, arranged Chobe day trips, and built school programmes out of the Falls.
