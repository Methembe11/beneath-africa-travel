        - generic [ref=f13e17]: About · Our Story
        - heading "Our Story" [level=1] [ref=f13e18]
        - paragraph [ref=f13e19]: Established in Victoria Falls in 2013, with a vision to grow within Zimbabwe.
    - generic [ref=f13e21]:
      - paragraph [ref=f13e22]: Zeresh Trading Company, trading as Beneath Africa Travel and Tours, was established in 2013 by Naume Ndoro, Bruce Nyakusengwa and Ranjisi Nyakusengwa as a tourism company based in Victoria Falls. The registered company is Zeresh Trading Company Private Limited, company number 845/2013, registered by the Registrar of Companies Zimbabwe.
      - paragraph [ref=f13e23]: The vision was to grow within Zimbabwe while specialising in road and water transfers, educational school trips, and tours around Botswana, Namibia, Zambia and Zimbabwe — with accommodation in hotels, lodges and camps, camping, houseboats on Lake Kariba, Chobe day trips and other activities in and around Victoria Falls.
    - generic [ref=f13e26]:
      - generic [ref=f13e27]:
        - heading "Registered Tourism Company" [level=3] [ref=f13e28]
        - paragraph [ref=f13e29]: Zeresh Trading Company Private Limited, company number 845/2013.
      - generic [ref=f13e30]:
